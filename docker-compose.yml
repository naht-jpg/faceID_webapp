version: '3'

services:
  backend:
    build:
      context: ./faceID
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./faceID:/app
    working_dir: /app
    environment:
      - DEBUG=True
      - MONGO_URI=mongodb://host.docker.internal:27017/CongTy
    
  frontend:
    build:
      context: ./faceID-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./faceID-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: